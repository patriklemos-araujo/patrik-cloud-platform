
name: Required CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f .github/workflows/terraform-ci.yml

          echo "Required repository files found."
