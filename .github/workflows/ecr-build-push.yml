name: Build, Push and Deploy to ECS

on:
  push:
    branches:
      - main
      - feat/ecr-ecs-fargate-lab
    paths:
      - "terraform-labs/07-ecr-ecs-fargate/app/**"
      - "terraform-labs/07-ecr-ecs-fargate/ecs-task-definition.json"
      - ".github/workflows/ecr-build-push.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: patrik-cloud-platform-app
  ECS_CLUSTER: patrik-cloud-platform-cluster
  ECS_SERVICE: patrik-cloud-platform-service
  ECS_TASK_DEFINITION: terraform-labs/07-ecr-ecs-fargate/ecs-task-definition.json
  CONTAINER_NAME: app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::910093226300:role/github-actions-ecs-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: terraform-labs/07-ecr-ecs-fargate/app
        run: |
          docker build -t $ECR_REPOSITORY:${GITHUB_SHA} .

      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:${GITHUB_SHA} \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}

      - name: Push Docker image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA}

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true