name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "terraform-labs/03-remote-state/app/**"
      - ".github/workflows/terraform-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "terraform-labs/03-remote-state/app/**"
      - ".github/workflows/terraform-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  

jobs:
  validate:
    name:  Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform-labs/03-remote-state/app

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Verificar formatacao
        run: terraform fmt -check -diff

      - name: Inicializar Terraform sem backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validar Terraform
        run: terraform validate -no-color

  plan:
    name: Terraform Plan
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform-labs/03-remote-state/app

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v7

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::910093226300:role/github-actions-terraform-ci
          aws-region: us-east-1

      - name: Verificar identidade AWS
        run: aws sts get-caller-identity

      - name: Inicializar Terraform
        run: terraform init -input=false -no-color

      - name: Planejar Terraform
        run: terraform plan -input=false -no-color -lock-timeout=60s